services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scope3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scope3_password}
      POSTGRES_DB: ${POSTGRES_DB:-scope3}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scope3} -d ${POSTGRES_DB:-scope3}"]
      interval: 10s
      timeout: 5s
      retries: 10

  ledger:
    build:
      context: ./nucleo-ledger
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${LEDGER_DATABASE_URL:-postgresql+psycopg2://scope3:scope3_password@postgres:5432/scope3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_password}
      S3_BUCKET: ${S3_BUCKET:-scope3-evidence}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  narrative:
    build:
      context: ./nucleo-narrative
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LEDGER_BASE_URL: ${LEDGER_BASE_URL:-http://ledger:8000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro}
    depends_on:
      ledger:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
