# Production notes:
#   - Set strong secrets via .env (never commit .env):
#       JWT_SECRET=<random 64-char hex>
#       POSTGRES_PASSWORD=<strong password>
#       S3_ACCESS_KEY / S3_SECRET_KEY=<rotated credentials>
#   - Remove host port mappings below and front with a TLS-terminating
#     reverse proxy (nginx/Caddy) in production.
#   - Services communicate over the 'internal' bridge network;
#     inter-service traffic does not leave the Docker host.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scope3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-scope3}
    # Dev only: remove in production
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scope3} -d ${POSTGRES_DB:-scope3}"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: ${LEDGER_DATABASE_URL:-postgresql+psycopg2://scope3:scope3_password@postgres:5432/scope3}
    command: >
      sh -c "pip install psycopg2-binary -q && python scripts/migrate.py"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  ledger:
    build:
      context: .
      dockerfile: nucleo-ledger/Dockerfile
      args:
        APP_GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${LEDGER_DATABASE_URL:-postgresql+psycopg2://scope3:scope3_password@postgres:5432/scope3}
      JWT_SECRET: ${JWT_SECRET}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-scope3-evidence}
      S3_REGION: ${S3_REGION:-us-east-1}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      APP_GIT_SHA: ${GIT_SHA:-unknown}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_NOTIFY_EVENTS: ${SLACK_NOTIFY_EVENTS:-human_review_required,cbam_calculation_completed,pipeline_completed}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Dev only: remove in production
    ports:
      - "8000:8000"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  narrative:
    build:
      context: .
      dockerfile: nucleo-narrative/Dockerfile
      args:
        APP_GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    environment:
      LEDGER_BASE_URL: ${LEDGER_BASE_URL:-http://ledger:8000}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      APP_GIT_SHA: ${GIT_SHA:-unknown}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_NOTIFY_EVENTS: ${SLACK_NOTIFY_EVENTS:-human_review_required,cbam_calculation_completed,pipeline_completed}
    depends_on:
      ledger:
        condition: service_healthy
    # Dev only: remove in production
    ports:
      - "8001:8001"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  narrative-worker:
    build:
      context: .
      dockerfile: nucleo-narrative/Dockerfile
      args:
        APP_GIT_SHA: ${GIT_SHA:-unknown}
    command: ["arq", "narrative_app.worker.WorkerSettings"]
    restart: unless-stopped
    environment:
      LEDGER_BASE_URL: ${LEDGER_BASE_URL:-http://ledger:8000}
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-3-5-sonnet-latest}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-pro}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT:-}
      APP_GIT_SHA: ${GIT_SHA:-unknown}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_NOTIFY_EVENTS: ${SLACK_NOTIFY_EVENTS:-human_review_required,cbam_calculation_completed,pipeline_completed}
      ARQ_MAX_JOBS: ${ARQ_MAX_JOBS:-10}
    depends_on:
      redis:
        condition: service_healthy
      ledger:
        condition: service_healthy
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.51.0
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - internal
    depends_on:
      - ledger
      - narrative

  grafana:
    image: grafana/grafana:10.4.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin}"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - internal
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.56
    restart: unless-stopped
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
    networks:
      - internal

  backup:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    entrypoint: >
      sh -c "pip install boto3 psycopg2-binary -q &&
             while true; do python /scripts/backup.py; sleep 86400; done"
    volumes:
      - ./scripts:/scripts:ro
    environment:
      DATABASE_URL: ${LEDGER_DATABASE_URL:-postgresql+psycopg2://scope3:scope3_password@postgres:5432/scope3}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-scope3-evidence}
      BACKUP_RETAIN_DAYS: ${BACKUP_RETAIN_DAYS:-30}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  grafana_data:
