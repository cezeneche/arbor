global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "nucleo-ledger"
    static_configs:
      - targets: ["ledger:8000"]
    metrics_path: /metrics

  - job_name: "nucleo-narrative"
    static_configs:
      - targets: ["narrative:8001"]
    metrics_path: /metrics
