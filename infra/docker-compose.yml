services:
  postgres:
    image: postgres:16
    container_name: scope3_postgres
    environment:
      POSTGRES_USER: scope3
      POSTGRES_PASSWORD: scope3_password
      POSTGRES_DB: scope3
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: scope3_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data:
