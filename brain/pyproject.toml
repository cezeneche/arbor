[project]
name = "arbor-brain"
version = "0.1.0"
description = "Arbor brain — Python service for the defensible maths behind the TypeScript product."
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110,<1.0",
    "pydantic>=2.6,<3.0",
]

[project.optional-dependencies]
dev = ["uvicorn>=0.29", "pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
