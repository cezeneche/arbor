[pytest]
addopts = -q --import-mode=importlib --strict-markers
testpaths =
    api/tests
    tests
pythonpath =
    api
    tests
markers =
    regulatory: tests that verify a specific regulatory rule or the calculation engine's purity. Must pass with zero skips before any production deploy (software.md Rule 6 / test.md deployment gate).
    golden: frozen input/output pairs for the CBAM domain logic. Must pass unchanged after every integration phase; regenerate only deliberately via GOLDEN_UPDATE=1.
