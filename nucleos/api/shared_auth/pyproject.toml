[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-auth"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
# shared_auth/ is both the project root and the package.
# Look in the parent directory so setuptools discovers the shared_auth package.
where = [".."]
include = ["shared_auth*"]
