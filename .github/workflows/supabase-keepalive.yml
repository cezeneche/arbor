name: Supabase Keepalive

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase
    runs-on: ubuntu-latest

    steps:
      # Supabase free-tier inactivity detection counts API-gateway traffic,
      # not raw pooler connections — the REST ping is what prevents pausing.
      - name: Ping REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_KEEPALIVE_API_KEY }}
        run: |
          curl --fail -sS -o /dev/null "$SUPABASE_URL/rest/v1/" \
            -H "apikey: $SUPABASE_API_KEY" \
            -H "Authorization: Bearer $SUPABASE_API_KEY"

      - name: Ping database
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_KEEPALIVE_DATABASE_URL }}
        run: psql "$DATABASE_URL" -c "SELECT 1;"
