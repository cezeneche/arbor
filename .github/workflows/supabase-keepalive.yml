name: Supabase Keepalive

on:
  schedule:
    - cron: "0 6 */4 * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Supabase database
    runs-on: ubuntu-latest

    steps:
      - name: Install postgresql-client
        run: sudo apt-get update -y && sudo apt-get install -y postgresql-client

      - name: Ping database
        env:
          # Password passed literally via PGPASSWORD so special characters need
          # no URL-encoding. Host/user/port are not secret (project ref is
          # already public), so they stay inline as one source of truth.
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          psql \
            -h aws-1-eu-west-1.pooler.supabase.com \
            -p 6543 \
            -U postgres.qwpxqwtgosmgpnposwpo \
            -d postgres \
            -c "SELECT 1;"
