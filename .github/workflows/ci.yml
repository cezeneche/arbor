# CI — enforces the CLAUDE.md deployment gate on every push/PR:
# all tests pass (zero failures, zero skips) and the code typechecks.
# Vercel only compiles; this is where the suite actually runs.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # postinstall already ran `prisma generate`; tsc needs the generated client.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx jest --ci
