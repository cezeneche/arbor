name: HMRC exchange rates

# HMRC publishes next month's exchange rates on the penultimate Thursday of each
# month. Every Friday this fetches any newly published month into Nucleos's
# reference table (nucleos/scripts/update_hmrc_rates.py), runs the rate-table
# tests, and proposes it for review. The tests run here because GitHub does not
# run CI on a pull request opened with this workflow's token. It fails, and
# GitHub emails the repository's watchers, when the current month's rates are
# not on main.

on:
  schedule:
    - cron: "0 7 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  rates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Checked against main as it is, before anything is fetched.
      - name: This month's rates are on main
        id: current
        continue-on-error: true
        working-directory: nucleos
        run: python scripts/update_hmrc_rates.py --check

      - name: Fetch newly published months
        working-directory: nucleos
        run: python scripts/update_hmrc_rates.py

      - name: Anything new?
        id: new
        run: |
          if git diff --quiet; then
            echo "No new months."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Nucleos
        if: steps.new.outputs.changed == 'true'
        run: |
          python -m venv nucleos/.venv
          nucleos/.venv/bin/python -m pip install --upgrade pip
          nucleos/.venv/bin/python -m pip install -r nucleos/api/requirements.txt

      # A month that fails these never reaches review.
      - name: Test the rate table
        if: steps.new.outputs.changed == 'true'
        working-directory: nucleos
        run: >
          .venv/bin/python -m pytest -q -p no:warnings
          api/tests/test_cpr_reference.py
          api/tests/test_hmrc_exchange_rates.py
          api/tests/test_cpr_exchange_rate.py

      - name: Propose them for review
        if: steps.new.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/hmrc-rates-$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add nucleos/api/app/services/hmrc_exchange_rates_data.py
          git commit -m "Add HMRC's newly published monthly exchange rates"
          git push origin "$branch"
          body="HMRC has published new monthly exchange rates. Generated by nucleos/scripts/update_hmrc_rates.py from trade-tariff.service.gov.uk. Months already held are unchanged. The rate-table tests passed in the workflow run; CI does not run on this pull request because a workflow opened it."
          if ! gh pr create --base main --head "$branch" --title "HMRC exchange rates: new month published" --body "$body"; then
            # Actions may not be allowed to open pull requests in this repository.
            gh issue create --title "HMRC exchange rates: new month ready to merge" \
              --body "$body Open the pull request: https://github.com/${{ github.repository }}/compare/main...$branch"
          fi

      - name: Fail if this month's rates were missing from main
        if: steps.current.outcome == 'failure'
        run: |
          echo "The current month's HMRC rates are not on main. Merge the rates pull request."
          exit 1
