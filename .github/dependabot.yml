# E5: dependency updates as pull requests, so fixes arrive before the audit gate
# in CI has to fail on them. Minor and patch updates are grouped per ecosystem
# to keep the queue reviewable; majors come one at a time.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # Types must describe the Node that runs the code: Vercel and CI run
      # Node 24. Move this when the runtime moves.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # TypeScript 7 is the native (Go) compiler. ts-jest (tests) supports
      # TypeScript below 7 and typescript-eslint (lint) below 6.1, so 7 cannot
      # install yet (#206, closed 14 November 2026). 6.x is still offered.
      # Move this when both support 7.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # One package per PR, not grouped: requirements.txt pins the whole tree, so a
  # grouped update can be unresolvable (a 59-package group was), and each change
  # must be checked against Vercel's bundle size and the golden set on its own.
  - package-ecosystem: pip
    directory: /nucleos/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: pip
    directory: /brain
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
